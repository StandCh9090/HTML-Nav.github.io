<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a27">
  <meta name="description" content="オフラインでもGPSで使える、スマートフォン向けのOpenStreetMapナビ">
  <title>michi — オフラインGPSナビ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="michi ホーム"><span class="brand-mark">m</span><span>michi<span class="brand-sub"> GPS NAVI</span></span></a>
      <div class="top-actions">
        <button id="voiceBtn" class="icon-button" aria-label="音声案内をオン" title="音声案内">🔊</button>
        <div class="connection"><span id="connectionDot" class="connection-dot"></span><span id="connectionText">接続確認中</span></div>
      </div>
    </header>

    <section class="map-wrap" aria-label="地図">
      <div id="map" class="map" role="application" aria-label="OpenStreetMap"></div>
      <svg id="routeLayer" class="route-layer" aria-hidden="true"></svg>
      <div id="mapHint" class="map-hint">GPSを取得すると現在地を表示します</div>
      <div class="map-controls">
        <button id="locateBtn" class="map-button locate-button" aria-label="現在地へ移動" title="現在地へ移動">◎</button>
        <button id="zoomIn" class="map-button" aria-label="拡大">＋</button>
        <button id="zoomOut" class="map-button" aria-label="縮小">−</button>
      </div>
      <div class="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors</div>
    </section>

    <section class="panel">
      <div id="guidance" class="guidance hidden" aria-live="polite">
        <div class="turn-icon" id="turnIcon">↑</div>
        <div class="guidance-copy"><span id="nextTurnLabel" class="eyebrow">次の案内</span><strong id="nextTurn">ルートに沿って進んでください</strong><span id="turnDistance" class="muted"></span></div>
        <button id="stopBtn" class="stop-button" aria-label="ナビを終了">終了</button>
      </div>

      <div class="destination-heading"><div><p class="eyebrow">目的地を設定</p><h1>どこへ行きますか？</h1></div><span class="offline-pill">● オフライン対応</span></div>
      <div class="destination-form">
        <label class="field"><span>緯度</span><input id="destLat" inputmode="decimal" type="number" step="any" placeholder="例: 35.6812" aria-label="目的地の緯度"></label>
        <label class="field"><span>経度</span><input id="destLon" inputmode="decimal" type="number" step="any" placeholder="例: 139.7671" aria-label="目的地の経度"></label>
      </div>
      <button id="routeBtn" class="primary-button">ルートを検索 <span aria-hidden="true">→</span></button>
      <p class="helper" id="helperText">ルート検索にはネット接続と現在地の許可が必要です。検索済みルートと地図タイルは端末へ保存されます。表示した地図は自動でオフライン用に蓄積されます。</p>
      <div class="route-summary hidden" id="routeSummary"><span id="routeDistance"></span><span class="summary-divider">·</span><span id="routeDuration"></span><span class="summary-note">この端末に保存済み</span></div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
